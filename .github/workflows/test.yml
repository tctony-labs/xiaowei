name: Full test suite

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HUSKY: "0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Go toolchain
        id: go-toolchain
        run: |
          awk '
            $1 == "go" { version = $2 }
            $1 == "toolchain" { version = substr($2, 3) }
            END { print "version=" version }
          ' server/go.mod >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-toolchain.outputs.version }}
          cache: false

      - name: Locate Go caches and compute snapshot keys
        id: go-cache
        env:
          MODULE_HASH: >-
            ${{ hashFiles('server/go.mod', 'server/go.sum', 'contracts/go/go.mod', 'contracts/go/go.sum') }}
          BUILD_HASH: >-
            ${{ hashFiles('server/**/*.go', 'server/**/*.sql', 'contracts/go/**/*.go',
            'server/go.mod', 'server/go.sum', 'contracts/go/go.mod', 'contracts/go/go.sum',
            '.github/workflows/test.yml') }}
        run: |
          go version
          echo "module-path=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build-path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "prefix=go-v1-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "module-hash=$MODULE_HASH" >> "$GITHUB_OUTPUT"
          echo "build-hash=$BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Go module downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.module-path }}
          key: ${{ steps.go-cache.outputs.prefix }}-modules-${{ steps.go-cache.outputs.module-hash }}
          restore-keys: ${{ steps.go-cache.outputs.prefix }}-modules-

      # Rotate immutable snapshots on Go input changes while reusing unchanged compiled packages.
      - name: Cache Go builds
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache.outputs.build-path }}
          key: ${{ steps.go-cache.outputs.prefix }}-build-${{ steps.go-cache.outputs.build-hash }}
          restore-keys: ${{ steps.go-cache.outputs.prefix }}-build-

      - name: Set up Rust from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Compute Cargo cache key
        id: cargo-key
        run: node scripts/ci/cargo-cache.mjs key >> "$GITHUB_OUTPUT"

      # Save complete targets, including workspace crates, for each Rust input revision.
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ steps.cargo-key.outputs.key }}
          restore-keys: ${{ steps.cargo-key.outputs.restore-key }}

      # A new checkout must not make unchanged cached Cargo inputs look newer than their outputs.
      - name: Restore unchanged Cargo input timestamps
        run: node scripts/ci/cargo-cache.mjs restore

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.46.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Prepare native outputs once, then run workspace tests serially.
      - name: Run all automated tests
        run: just test

      - name: Record Cargo input timestamps for the next run
        run: node scripts/ci/cargo-cache.mjs save
