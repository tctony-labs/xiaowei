name: Full test suite

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full test suite (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HUSKY: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: contracts/go/go.sum

      - name: Set up Rust from rust-toolchain.toml
        run: rustup show active-toolchain

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Set up just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.46.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Keep the existing serial runner: Gateway and desktop share napi fixtures.
      - name: Run all automated tests
        run: just test
