name: Server image
run-name: Server image (${{ inputs.source_ref }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or full commit SHA (deployment skill supplies an immutable SHA)
        required: true
        default: develop
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record immutable source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Server and production Compose (amd64)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: xiaowei_test
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaowei_test -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      XIAOWEI_TEST_DATABASE_URL: postgres://xiaowei_test:ci-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            contracts/out/proto-server-go/go.sum

      - name: Set up Node.js for deployment acceptance
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Test Go contracts
        working-directory: contracts/out/proto-server-go
        run: go test ./... && go vet ./...

      - name: Test server against real PostgreSQL
        working-directory: server
        run: go test -count=1 -race ./... && go vet ./...

      - name: Build native server image
        run: docker build --file server/deploy/Dockerfile --tag xiaowei-server:ci .

      - name: Verify standalone production Compose
        env:
          XIAOWEI_DEPLOY_TEST_IMAGE: xiaowei-server:ci
        run: node server/deploy/verify.mjs

  publish:
    name: Publish amd64 server image
    needs: [resolve, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.resolve.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=xiaowei-server
          cache-to: type=gha,scope=xiaowei-server,mode=max

      - name: Assemble deployment bundle
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p bundle/config
          cp server/deploy/compose.xiaowei.yaml bundle/compose.yaml
          cp server/deploy/server.example.yaml bundle/config/server.example.yaml
          cp server/deploy/.env.example bundle/config/.env.example
          cp server/deploy/nginx.example.conf bundle/nginx.example.conf
          cp server/deploy/nginx.logrotate bundle/nginx.logrotate
          cp server/deploy/backup.sh bundle/backup.sh
          cp server/docs/deployment.md bundle/README.md
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > bundle/image.txt
          printf 'sha=%s\nrun_id=%s\nrun_url=%s\nimage=%s@%s\n' \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$RUN_URL" "$IMAGE" "$DIGEST" > bundle/release.txt
          tar -C bundle -czf server-deployment.tar.gz .
          printf 'Deploy image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: server-deployment
          path: server-deployment.tar.gz
