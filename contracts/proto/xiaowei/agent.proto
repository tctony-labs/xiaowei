syntax = "proto3";

package xiaowei.agent;

// Embedded App Server contract; not Codex wire compatible.
// Session corresponds to Codex Thread, Run to Codex Turn; Item is a UI projection.
// IDs are canonical UUIDv7 strings. Host supplies the rollout root for durable sessions.
// Cancelling an RPC or observation never interrupts an accepted run.
// Method order: session management/observation, run control, then other misc.
service Agent {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ReadSession(ReadSessionRequest) returns (ReadSessionResponse);
  // Commits session defaults immediately; an active run retains its own snapshot.
  // Stale expected_metadata_revision is conflict. Observe SessionConfigUpdated.
  rpc SetSessionConfig(SetSessionConfigRequest) returns (SetSessionConfigResponse);
  // Stores a manual title and disables automatic titles until RegenerateTitle
  // succeeds. Cancels pending title generation; never interrupts a chat run.
  rpc SetSessionTitle(SetSessionTitleRequest) returns (SetSessionTitleResponse);
  rpc SetSessionArchived(SetSessionArchivedRequest) returns (SetSessionArchivedResponse);
  // Deletes explicit targets in order. Conflicts skip; actual failures stop the batch.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // First frame contains current state, atomically followed by later events.
  // This is live observation, not history replay. Lag terminates the stream with
  // resource-exhausted: subscribe again and replace cache with the first snapshot.
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream AgentEvent);
  // Call only while displaying this session in a visible, non-minimized window.
  // First frame acknowledges protection from automatic archive; closing/cancelling
  // the stream releases it. Independent of SubscribeSession and manual archive/delete.
  rpc TrackSessionViewing(TrackSessionViewingRequest) returns (stream SessionViewingReady);
  // Accepts one run per session; returns immediately, completion follows on SubscribeSession.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc InterruptRun(InterruptRunRequest) returns (InterruptRunResponse);
  // Waits for a complete title. Also publishes SessionTitleUpdated on success.
  // Failure leaves the previous title unchanged; never starts a chat run.
  rpc RegenerateTitle(RegenerateTitleRequest) returns (RegenerateTitleResponse);
  // Reads the saved automatic archive/delete policy for settings initialization and refresh.
  // Defaults to archiving after 3 inactive days with automatic deletion disabled.
  // Query only; never triggers archiving or deletion.
  rpc GetSessionRetentionPolicy(GetSessionRetentionPolicyRequest) returns (SessionRetentionPolicy);
  // Persists both values atomically, then restarts the active maintenance task.
  // The new task waits for the previous check to settle, checks immediately, then hourly.
  // Response acknowledges saving and scheduling, not completion of archive/delete actions.
  // Save failure leaves the previous policy and maintenance task unchanged.
  rpc SetSessionRetentionPolicy(SetSessionRetentionPolicyRequest) returns (SessionRetentionPolicy);
}

message AgentModelConfig {
  // Opaque model reference supplied by the caller; nonblank, <= 1024 UTF-8 bytes.
  // Agent does not read ModelSettings or resolve provider configuration.
  string model_ref = 1;
  // Absent delegates reasoning choice to the generation adapter/model default.
  // Present must be nonblank, <= 128 UTF-8 bytes; adapter validates support.
  optional string reasoning = 2;
}

enum AgentSessionStatus {
  AGENT_SESSION_STATUS_UNSPECIFIED = 0;
  AGENT_SESSION_STATUS_IDLE = 1;
  AGENT_SESSION_STATUS_RUNNING = 2;
  AGENT_SESSION_STATUS_DELETED = 3;
}

enum ModelInfoWarningCode {
  MODEL_INFO_WARNING_CODE_UNSPECIFIED = 0;
  MODEL_INFO_WARNING_CODE_NOT_FOUND = 1;
  MODEL_INFO_WARNING_CODE_UNAVAILABLE = 2;
  MODEL_INFO_WARNING_CODE_INVALID_RESPONSE = 3;
}

message ModelInfoWarning {
  string model_ref = 1;
  ModelInfoWarningCode code = 2;
}

message AgentUserInput {
  oneof content {
    // MVP supports text only. Nonblank UTF-8; request total <= 64 KiB.
    string text = 1;
  }
}

message AgentUserMessage {
  repeated AgentUserInput content = 1;
}

message AgentMessage {
  string text = 1;
}

message AgentReasoning {
  string text = 1;
}

message AgentItem {
  string item_id = 1;
  oneof content {
    AgentUserMessage user_message = 2;
    AgentMessage agent_message = 3;
    AgentReasoning reasoning = 4;
  }
}

enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  AGENT_RUN_STATUS_IN_PROGRESS = 1;
  AGENT_RUN_STATUS_COMPLETED = 2;
  AGENT_RUN_STATUS_FAILED = 3;
  AGENT_RUN_STATUS_INTERRUPTED = 4;
}

message AgentRun {
  string run_id = 1;
  string input_id = 2;
  AgentRunStatus status = 3;
  AgentModelConfig config = 4;
  repeated AgentItem items = 5;
  int64 started_at_ms = 6;
  // Absent while running; present for every terminal state.
  optional int64 completed_at_ms = 7;
  // Safe display message for failed runs only; no raw provider error/credentials.
  optional string error = 8;
  string provider_name = 9;
  string model_name = 10;
}

message AgentSession {
  string session_id = 1;
  AgentModelConfig config = 2;
  AgentSessionStatus status = 3;
  int64 created_at_ms = 4;
  // In-memory revision for this Agent service instance; never persisted.
  // Starts at 1 when a session is restored. Refresh the snapshot after reconnecting
  // to a restarted service and discard pending requests using an old revision.
  // Changes only when session metadata/default configuration changes.
  uint64 metadata_revision = 5;
  // Complete retained display history, grouped by run/item. ReadSession includes
  // it only with include_runs=true; SubscriptionReady always includes it.
  // These are display projections, not messages for constructing model history.
  repeated AgentRun runs = 6;
  // Empty until a title has been set or generated. Does not enter chat history.
  string title = 7;
  // Deprecated: auxiliary selection is obtained from AgentHost per task. Always empty.
  string title_model_ref = 8;
  // New sessions enable automatic titles. Setting a title disables them;
  // successful RegenerateTitle enables them again. Failures leave the flag unchanged.
  bool auto_title_enabled = 9;
  // Independent display names; empty when unknown. Format only at the UI boundary.
  string provider_name = 10;
  string model_name = 11;
  // Current in-memory query warning, independent of run status and metadata revision.
  ModelInfoWarning model_info_warning = 12;
  bool archived = 13;
  uint64 archive_revision = 14;
  int64 updated_at_ms = 15;
}

// Agent-root policy; defaults match the old app: 3 days to archive, deletion off.
message SessionRetentionPolicy {
  // Allowed: 1, 3, 7, 15. Age is measured from last activity (updated_at_ms).
  uint32 archive_after_days = 1;
  // Allowed: 0 (off), 30, 90, 180, 365. Only archived sessions are deleted,
  // based on last activity, not time archived. Restoring bumps last activity.
  uint32 delete_after_days = 2;
}

message CreateSessionRequest {
  // Creation idempotency key retained only in the current service instance's memory.
  // Same key with different config conflicts; matching repeats return the current session.
  // After restart use session_id to reopen; creation keys are not recovered from history.
  string client_request_id = 1;
  // Required. Missing model settings must be resolved by the caller before create.
  AgentModelConfig config = 2;
  // Deprecated and ignored. Auxiliary selection is obtained from AgentHost.
  string title_model_ref = 3;
}

message CreateSessionResponse {
  AgentSession session = 1;
}

message ListSessionsRequest {
  bool archived = 1;
  // Zero defaults to 50; maximum 100.
  uint32 page_size = 2;
  // Opaque keyset position, bound to archived and query filters. Empty starts a new query.
  string continuation = 3;
  // Case-insensitive literal title substring, trimmed; <= 256 UTF-8 bytes.
  string query = 4;
}

message AgentSessionSummary {
  string session_id = 1;
  // Actual manual/generated title; empty while untitled.
  string title = 2;
  reserved 3;
  reserved "first_input_preview";
  AgentSessionStatus status = 4;
  int64 created_at_ms = 5;
  // Current in-memory revision if loaded; otherwise 1. Same scope as AgentSession.
  uint64 metadata_revision = 6;
  // Whether future run completion may automatically update the title.
  bool auto_title_enabled = 7;
  bool archived = 8;
  uint64 archive_revision = 9;
  int64 updated_at_ms = 10;
}

message ListSessionsResponse {
  // Registered sessions, ordered by updated_at_ms then ID descending. Refresh on menu open;
  // this point-in-time list never replaces a SubscribeSession projection.
  repeated AgentSessionSummary sessions = 1;
  string continuation = 2;
}

message ReadSessionRequest {
  string session_id = 1;
  // False reads metadata only; true includes all retained runs and their items.
  // Standalone point-in-time query. Do not merge this response into a live event
  // cache: use the atomic initial snapshot from SubscribeSession.
  bool include_runs = 2;
}

message ReadSessionResponse {
  // False for unknown or deleted sessions; session is then absent.
  bool found = 1;
  AgentSession session = 2;
}

message SetSessionConfigRequest {
  string session_id = 1;
  // Required full selection. Absent reasoning delegates to model defaults.
  AgentModelConfig config = 2;
  uint64 expected_metadata_revision = 3;
}

message SetSessionConfigResponse {
  // Acknowledgement only; never replace a live subscription with this response.
  uint64 metadata_revision = 1;
}

message SetSessionTitleRequest {
  string session_id = 1;
  // Trimmed before validation/storage: nonblank, single line, no control
  // characters, <= 50 Unicode characters. Manual text is never truncated.
  // Mutations are serialized by the server; the last accepted title wins.
  string title = 2;
}

message SetSessionTitleResponse {
  // Acknowledgement only; observe SessionTitleUpdated for live UI state.
  // Repeating the same manual title is a no-op unless a title task is pending.
  string title = 1;
  uint64 metadata_revision = 2;
}

// Archived sessions cannot be opened or mutated until unarchived.
// Archiving cancels and awaits the active run, preserving its partial output.
message SetSessionArchivedRequest {
  string session_id = 1;
  bool archived = 2;
  uint64 expected_archive_revision = 3;
}

message SetSessionArchivedResponse {
  bool archived = 1;
  uint64 archive_revision = 2;
}

message DeleteSessionTarget {
  string session_id = 1;
  // Required optimistic revision, 1..2^63-1.
  uint64 expected_metadata_revision = 2;
  // Present requires the session to still be archived at this revision (1..2^63-1).
  // Absent permits deletion of an ordinary or archived session.
  optional uint64 expected_archive_revision = 3;
}

message DeleteSessionRequest {
  // Nonempty explicit unique targets, in execution order.
  // Invalid IDs/revisions or duplicate targets reject the whole request before deletion.
  repeated DeleteSessionTarget targets = 1;
}

enum DeleteSessionStatus {
  DELETE_SESSION_STATUS_UNSPECIFIED = 0;
  DELETE_SESSION_STATUS_DELETED = 1;
  // Missing session, changed metadata/archive revision, or no longer archived.
  DELETE_SESSION_STATUS_SKIPPED = 2;
  DELETE_SESSION_STATUS_FAILED = 3;
  DELETE_SESSION_STATUS_NOT_EXECUTED = 4;
}

message DeleteSessionResult {
  string session_id = 1;
  DeleteSessionStatus status = 2;
  // Safe explanation for skipped/failed targets; no storage paths or credentials.
  string error = 3;
}

message DeleteSessionResponse {
  // One result per requested target, preserving request order. No rollback.
  // First actual failure stops execution; remaining targets are NOT_EXECUTED.
  repeated DeleteSessionResult results = 1;
}

message SubscribeSessionRequest {
  // Required canonical UUIDv7. Observes exactly this session; missing/invalid
  // IDs are invalid-argument, unknown/deleted sessions are not-found.
  // Host authorization remains the responsibility of the transport integration.
  string session_id = 1;
}

// First frame: full public state of the requested session, including retained
// runs/items. Session is always present on a successfully opened subscription.
// Snapshot and registration use the same serial boundary; earlier events are
// not replayed. Later deletion/run/item changes follow on this stream.
// Reject subscription with resource-exhausted if initial state exceeds its
// frame budget; never truncate state or yield an already-invalid subscription.
message SubscriptionReady {
  AgentSession session = 1;
}

message SessionStarted {
  AgentSession session = 1;
}

message SessionDeleted {
  string session_id = 1;
}

message RunStarted {
  string session_id = 1;
  // Includes the immutable selection captured for this run.
  AgentRun run = 2;
  uint64 session_metadata_revision = 3;
  string title_model_ref = 4;
}

message RunCompleted {
  string session_id = 1;
  // Final run status and complete public items, including any partial display.
  AgentRun run = 2;
}

message ItemStarted {
  string session_id = 1;
  string run_id = 2;
  AgentItem item = 3;
}

message ItemCompleted {
  string session_id = 1;
  string run_id = 2;
  // Final display content, even if run fails or is interrupted. This does not
  // imply the item is eligible for inclusion in future model context.
  AgentItem item = 3;
}

message AgentMessageDelta {
  string session_id = 1;
  string run_id = 2;
  string item_id = 3;
  string delta = 4;
}

message ReasoningDelta {
  string session_id = 1;
  string run_id = 2;
  string item_id = 3;
  string delta = 4;
}

message SessionTitleUpdated {
  string session_id = 1;
  string title = 2;
  uint64 metadata_revision = 3;
  string title_model_ref = 4;
  // Committed automatic-title flag, synchronized with the title.
  bool auto_title_enabled = 5;
  // Committed activity time. Manual title changes advance it; automatic generation preserves it.
  int64 updated_at_ms = 6;
}

message SessionConfigUpdated {
  string session_id = 1;
  AgentModelConfig config = 2;
  string provider_name = 3;
  string model_name = 4;
  uint64 metadata_revision = 5;
}

message SessionModelInfoWarningUpdated {
  string session_id = 1;
  // Absent clears the warning. Snapshot + subsequent events share one serial boundary.
  ModelInfoWarning warning = 2;
  string provider_name = 3;
  string model_name = 4;
}

message SessionArchivedUpdated {
  string session_id = 1;
  bool archived = 2;
  uint64 archive_revision = 3;
}

// Ordered direct notifications. SubscriptionReady contains a snapshot captured
// atomically with observer registration. Following frames contain only changes
// after that snapshot; apply them once in order. No resumable event cursor.
// Control RPC responses confirm operations; do not replace the live cache with
// their session/run snapshots, which may arrive after newer stream events.
message AgentEvent {
  int64 emitted_at_ms = 1;
  oneof payload {
    SessionStarted session_started = 2;
    SessionDeleted session_deleted = 3;
    RunStarted run_started = 4;
    RunCompleted run_completed = 5;
    ItemStarted item_started = 6;
    ItemCompleted item_completed = 7;
    AgentMessageDelta agent_message_delta = 8;
    ReasoningDelta reasoning_delta = 9;
    SubscriptionReady subscription_ready = 10;
    SessionTitleUpdated session_title_updated = 11;
    SessionConfigUpdated session_config_updated = 12;
    SessionModelInfoWarningUpdated session_model_info_warning_updated = 13;
    SessionArchivedUpdated session_archived_updated = 14;
  }
}

message TrackSessionViewingRequest {
  // Required canonical UUIDv7; unknown/deleted/archived sessions cannot be viewed.
  string session_id = 1;
}

message SessionViewingReady {}

message StartRunRequest {
  string session_id = 1;
  // Stable input identity for correlation and idempotency; same ID with different
  // input/config conflicts. A lost response does not authorize a fresh ID retry.
  string input_id = 2;
  // Required, 1..64 text entries, ordered and preserved without trimming.
  repeated AgentUserInput input = 3;
  // Absent inherits session defaults. Present overrides this run only.
  // Persist session defaults independently through SetSessionConfig.
  AgentModelConfig config = 4;
  // Deprecated and ignored. Auxiliary selection is obtained from AgentHost per task.
  optional string title_model_ref = 5;
}

message StartRunResponse {
  // Acceptance, not completion. Same run is also announced by RunStarted.
  AgentRun run = 1;
}

message InterruptRunRequest {
  string session_id = 1;
  // Targets exactly this run; a stale request must not interrupt a newer run.
  string run_id = 2;
}

message InterruptRunResponse {
  bool found = 1;
  // Acknowledges cancellation only. Await RunCompleted for final status.
  bool cancellation_requested = 2;
}

message RegenerateTitleRequest {
  string session_id = 1;
  // Deprecated and ignored. AgentHost chooses the current auxiliary model per task.
  string title_model_ref = 2;
}

message RegenerateTitleResponse {
  string title = 1;
  uint64 metadata_revision = 2;
}

message GetSessionRetentionPolicyRequest {}

message SetSessionRetentionPolicyRequest {
  // Required full policy. Invalid/missing values leave the old policy unchanged.
  SessionRetentionPolicy policy = 1;
}
