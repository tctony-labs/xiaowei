syntax = "proto3";

package xiaowei.clipboard;

import "xiaowei/common.proto";

// Record and category IDs in this package must be in 1..=9223372036854775807.
enum ClipboardKind {
  CLIPBOARD_KIND_UNSPECIFIED = 0;
  CLIPBOARD_KIND_TEXT = 1;
  CLIPBOARD_KIND_IMAGE = 2;
  CLIPBOARD_KIND_FILE = 3;
}

// History summary. ReadText and ReadImage return the complete content.
message ClipboardItem {
  uint64 id = 1;
  ClipboardKind kind = 18;
  reserved 2, 3, 4, 8, 9;
  reserved "image_path", "text", "created_at", "last_used_at";
  // Text preview; may be truncated. ReadText returns the complete text.
  optional string preview_text = 14;
  // True when preview_text omits part of the stored text.
  bool preview_truncated = 17;
  repeated string paths = 5;
  optional uint32 width = 6;
  optional uint32 height = 7;
  int64 created_at_ms = 15;
  int64 last_used_at_ms = 16;
  uint32 use_count = 10;
  bool favorite = 11;
  optional string remark = 12;
  optional uint64 category_id = 13;
}

message ClipboardCategory {
  uint64 id = 1;
  string name = 2;
  string color = 3;
}

message ClipboardListOptions {
  // Empty selects the ordinary list. Nonempty searches indexed text, remark and paths:
  // whitespace-separated literal phrases are ANDed, with prefix matching on the last term.
  // At most 4096 UTF-8 bytes; search uses the first 200 bytes at a character boundary.
  optional string query = 1;
  // Omitted or false includes both ordinary and favorite records.
  optional bool favorites_only = 2;
  reserved 3;
  // Omitted selects all records; IMAGE and FILE are supported filters.
  optional ClipboardKind kind = 7;
  // Omitted does not filter by category.
  optional uint64 category_id = 4;
  // Default 50; accepted range 1..100.
  optional uint32 limit = 5;
  optional uint32 offset = 6;
}

message ClipboardItems {
  repeated ClipboardItem items = 1;
}

message OptionalItem {
  ClipboardItem item = 1;
}

message ClipboardCategories {
  repeated ClipboardCategory items = 1;
}

message FavoriteRequest {
  uint64 id = 1;
  bool favorite = 2;
}

message SaveCategoryRequest {
  optional uint64 id = 1;
  string name = 2;
  string color = 3;
}

message SetRemarkRequest {
  uint64 id = 1;
  string remark = 2;
}

message EditTextRequest {
  uint64 id = 1;
  string text = 2;
}

message SetCategoryRequest {
  uint64 id = 1;
  // Omitted clears the category assignment.
  optional uint64 category_id = 2;
}

message ClipboardItemRequest {
  uint64 id = 1;
}

message ClipboardCategoryRequest {
  uint64 id = 1;
}

message ReadTextResponse {
  string text = 1;
}

message ReadImageResponse {
  bytes png = 1;
}

message DeleteResponse {
  // True if a record existed and was deleted; false if it was already absent.
  bool deleted = 1;
}

message SetFavoriteResponse {
  // Whether the record existed and was updated, not its resulting favorite state.
  bool updated = 1;
}

message ClearHistoryResponse {
  // Favorites are retained.
  uint32 deleted_count = 1;
}

message PurgeOrdinaryResponse {
  // Count of records older than the request instant with no favorite, remark or category.
  uint32 deleted_count = 1;
}

message PurgeExpiredRequest {
  // Retention policy in days: 1, 7, 15 or 30. Permanent retention skips this operation.
  int32 retention_days = 1;
}

message ClipboardStorageUsage {
  // Bytes occupied by the shared database (including WAL) and clipboard attachments.
  uint64 used_bytes = 1;
}

message ClipboardResourceRequest {
  uint64 id = 1;
  // For a file record, omitted means all files; OpenResource requires exactly one file.
  optional uint32 index = 2;
}

message CopyResourcePathRequest {
  uint64 id = 1;
  optional uint32 index = 2;
  bool directory = 3;
}

message ClipboardChanged {}

service ClipboardBiz {
  rpc List(ClipboardListOptions) returns (ClipboardItems);
  rpc Get(ClipboardItemRequest) returns (OptionalItem);
  rpc ReadText(ClipboardItemRequest) returns (ReadTextResponse);
  rpc ReadImage(ClipboardItemRequest) returns (ReadImageResponse);
  rpc Copy(ClipboardItemRequest) returns (xiaowei.common.Empty);
  // Copies a selected item, hides the invoking Launcher, then pastes if enabled.
  rpc Select(ClipboardItemRequest) returns (xiaowei.common.Empty);
  rpc Delete(ClipboardItemRequest) returns (DeleteResponse);
  rpc SetFavorite(FavoriteRequest) returns (SetFavoriteResponse);
  rpc ClearHistory(xiaowei.common.Empty) returns (ClearHistoryResponse);
  // Captures the current instant on the owner, then removes only ordinary records last used before it.
  rpc PurgeOrdinary(xiaowei.common.Empty) returns (PurgeOrdinaryResponse);
  rpc PurgeExpired(PurgeExpiredRequest) returns (PurgeOrdinaryResponse);
  rpc StorageUsage(xiaowei.common.Empty) returns (ClipboardStorageUsage);
  rpc Categories(xiaowei.common.Empty) returns (ClipboardCategories);
  rpc SaveCategory(SaveCategoryRequest) returns (ClipboardCategory);
  rpc DeleteCategory(ClipboardCategoryRequest) returns (xiaowei.common.Empty);
  rpc SetRemark(SetRemarkRequest) returns (xiaowei.common.Empty);
  rpc EditText(EditTextRequest) returns (ClipboardItem);
  rpc SetCategory(SetCategoryRequest) returns (xiaowei.common.Empty);
  rpc OpenResource(ClipboardResourceRequest) returns (xiaowei.common.Empty);
  rpc RevealResource(ClipboardResourceRequest) returns (xiaowei.common.Empty);
  rpc CopyResourcePath(CopyResourcePathRequest) returns (xiaowei.common.Empty);
}

// Internal persistence boundary for the clipboard owner. No SQL or table names cross it.
message ClipboardEntity {
  uint64 id = 1;
  string kind = 2;
  optional string text = 3;
  repeated string paths = 4;
  optional uint32 width = 5;
  optional uint32 height = 6;
  int64 created_at_ms = 7;
  int64 last_used_at_ms = 8;
  uint32 use_count = 9;
  bool favorite = 10;
  optional string remark = 11;
  optional uint64 category_id = 12;
  string hash = 13;
}

message ClipboardEntityList {
  repeated ClipboardEntity entities = 1;
}

// Internal bounded recall for subsequent ranking; this is not the panel list API.
message SearchClipboardEntitiesRequest {
  // Same literal phrase / last-term-prefix semantics as List. Empty query returns no hits.
  // At most 4096 UTF-8 bytes; search uses the first 200 bytes at a character boundary.
  string query = 1;
  // Defaults to 100; valid range is 1..100. No pagination for recall.
  optional uint32 limit = 2;
}

message ClipboardEntityHit {
  // Always present on successful recall; large-text content is still the stored summary.
  ClipboardEntity entity = 1;
  // Plain-text context from indexed text, remark and paths, without highlight markup.
  // FTS5 selects up to 32 tokens; this is not a byte limit or the full document.
  // Omitted context is indicated by an ellipsis; one fragment may not cover every query term.
  string snippet = 2;
}

message ClipboardEntityHits {
  // Ordered by FTS5 relevance, then recent use and ID descending; no nucleo score yet.
  repeated ClipboardEntityHit hits = 1;
}

message OptionalClipboardEntity {
  ClipboardEntity entity = 1;
}

message CaptureClipboardEntityRequest {
  string hash = 1;
  string kind = 2;
  optional string text = 3;
  repeated string paths = 4;
  optional uint32 width = 5;
  optional uint32 height = 6;
  int64 created_at_ms = 7;
}

message TouchClipboardEntityRequest {
  uint64 id = 1;
  int64 used_at_ms = 2;
}

message EditClipboardEntityTextRequest {
  uint64 id = 1;
  string hash = 2;
  string kind = 3;
  string text = 4;
  int64 edited_at_ms = 5;
}

message AttachmentReference {
  string kind = 1;
  string hash = 2;
}

message EditClipboardEntityTextResponse {
  ClipboardEntity entity = 1;
  AttachmentReference previous_attachment = 2;
}

message DeletedClipboardEntities {
  uint32 deleted_count = 1;
  repeated AttachmentReference attachments = 2;
}

message PurgeClipboardEntitiesRequest {
  int64 cutoff_ms = 1;
}

message ClipboardEntityHashRequest {
  string hash = 1;
}

message ClipboardEntityHashReference {
  bool referenced = 1;
}

service ClipboardDao {
  rpc Capture(CaptureClipboardEntityRequest) returns (ClipboardEntity);
  rpc List(ClipboardListOptions) returns (ClipboardEntityList);
  // Invalid input returns InvalidArgument; storage failures are propagated.
  rpc Search(SearchClipboardEntitiesRequest) returns (ClipboardEntityHits);
  rpc Get(ClipboardItemRequest) returns (OptionalClipboardEntity);
  rpc Touch(TouchClipboardEntityRequest) returns (xiaowei.common.Empty);
  rpc SetFavorite(FavoriteRequest) returns (SetFavoriteResponse);
  rpc SetRemark(SetRemarkRequest) returns (xiaowei.common.Empty);
  rpc SetCategory(SetCategoryRequest) returns (xiaowei.common.Empty);
  rpc Categories(xiaowei.common.Empty) returns (ClipboardCategories);
  rpc SaveCategory(SaveCategoryRequest) returns (ClipboardCategory);
  rpc DeleteCategory(ClipboardCategoryRequest) returns (xiaowei.common.Empty);
  rpc EditText(EditClipboardEntityTextRequest) returns (EditClipboardEntityTextResponse);
  rpc Delete(ClipboardItemRequest) returns (DeletedClipboardEntities);
  // Each delete call removes at most 100 records. The caller repeats until fewer are returned.
  rpc PurgeOrdinaryBatch(PurgeClipboardEntitiesRequest) returns (DeletedClipboardEntities);
  rpc ClearHistoryBatch(xiaowei.common.Empty) returns (DeletedClipboardEntities);
  rpc HashReferenced(ClipboardEntityHashRequest) returns (ClipboardEntityHashReference);
}
