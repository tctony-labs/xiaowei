syntax = "proto3";

package xiaowei.system;

import "xiaowei/common.proto";

enum Theme {
  THEME_UNSPECIFIED = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
}

message ToggleThemeResponse {
  Theme theme = 1;
}

message OpenUrlRequest {
  // Only http and https URLs are accepted; local paths and executable schemes are rejected.
  string url = 1;
}

// Backend-resolved local resource; never a URL or shell command.
message LocalPathRequest {
  // Absolute path without NUL bytes. The target must exist.
  string path = 1;
}

message WriteClipboardTextRequest {
  // Plain text to replace the system clipboard with; an empty string clears text.
  string text = 1;
}

service System {
  rpc WriteClipboardText(WriteClipboardTextRequest) returns (xiaowei.common.Empty);
  rpc ToggleTheme(xiaowei.common.Empty) returns (ToggleThemeResponse);
  rpc OpenUrl(OpenUrlRequest) returns (xiaowei.common.Empty);
  // Open a file, directory or application using the OS default handler.
  // Missing targets and host errors fail the call; success does not wait for the application to exit.
  rpc OpenPath(LocalPathRequest) returns (xiaowei.common.Empty);
  // Reveal an existing target in the system file manager.
  // Success means the host accepted the request, not that the file manager confirmed selection.
  rpc RevealPath(LocalPathRequest) returns (xiaowei.common.Empty);
}
