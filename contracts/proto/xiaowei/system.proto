syntax = "proto3";

package xiaowei.system;

import "xiaowei/common.proto";

service System {
  // Open/focus settings and request navigation. Success means the window loaded,
  // not that the renderer has completed scrolling or highlighting.
  rpc OpenSettings(OpenSettingsRequest) returns (xiaowei.common.Empty);
  // Atomically read and clear the invoking window's pending destination.
  // Subscribe to SettingsNavigationRequested before calling, and call again on notifications.
  // UNSPECIFIED means no pending destination; this does not open a window.
  rpc TakeSettingsNavigation(xiaowei.common.Empty) returns (TakeSettingsNavigationResponse);
  // Apply OS login startup registration; host failures fail the call.
  rpc SetAutostart(SetAutostartRequest) returns (xiaowei.common.Empty);
  // Hide the invoking launcher and restore its invocation source on macOS.
  // Success confirms focus restoration; failure or cancellation prevents automatic paste.
  // Does not hide other windows of this application.
  // The host resolves the window from the original call context; no window ID is accepted.
  // Calls without a live renderer window fail. Does not copy or send paste keys.
  rpc HideWindow(xiaowei.common.Empty) returns (xiaowei.common.Empty);
  rpc WriteClipboardText(WriteClipboardTextRequest) returns (xiaowei.common.Empty);
  rpc ToggleTheme(xiaowei.common.Empty) returns (ToggleThemeResponse);
  rpc OpenUrl(OpenUrlRequest) returns (xiaowei.common.Empty);
  // Open a file, directory or application using the OS default handler.
  // Missing targets and host errors fail the call; success does not wait for the application to exit.
  rpc OpenPath(LocalPathRequest) returns (xiaowei.common.Empty);
  // Reveal an existing target in the system file manager.
  // Success means the host accepted the request, not that the file manager confirmed selection.
  rpc RevealPath(LocalPathRequest) returns (xiaowei.common.Empty);
}

enum Theme {
  THEME_UNSPECIFIED = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
}

enum SettingsAnchor {
  SETTINGS_ANCHOR_UNSPECIFIED = 0;
  SETTINGS_ANCHOR_MODEL_PROVIDERS = 1;
}

// Backend-resolved local resource; never a URL or shell command.
message LocalPathRequest {
  // Absolute path without NUL bytes. The target must exist.
  string path = 1;
}

// Notification only, delivered to the destination settings window. The host
// retains the latest pending anchor until that window consumes it.
message SettingsNavigationRequested {}

message OpenSettingsRequest {
  // Required destination; unspecified and unknown values are rejected.
  SettingsAnchor anchor = 1;
}

message TakeSettingsNavigationResponse {
  // UNSPECIFIED means this window has no pending navigation.
  SettingsAnchor anchor = 1;
}

message SetAutostartRequest {
  bool enabled = 1;
}

message WriteClipboardTextRequest {
  // Plain text to replace the system clipboard with; an empty string clears text.
  string text = 1;
}

message ToggleThemeResponse {
  Theme theme = 1;
}

message OpenUrlRequest {
  // Only http and https URLs are accepted; local paths and executable schemes are rejected.
  string url = 1;
}
