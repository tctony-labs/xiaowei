syntax = "proto3";

package xiaowei.server.common;

import "google/protobuf/descriptor.proto";

import "xiaowei/common.proto";

message ApiMethodOptions {
  // False or omitted requires an access session: authenticated HTTP and WebSocket.
  // True allows calls without a session, over HTTP only. Credentials may still be required.
  bool no_login = 1;
}

extend google.protobuf.MethodOptions {
  ApiMethodOptions api = 50001;
}

service Health {
  // No login required. Success means the server process can respond.
  rpc Check(xiaowei.common.Empty) returns (BaseResponse) {
    option (xiaowei.server.common.api).no_login = true;
  }

  // No login required. Probes database availability for up to two seconds.
  // Unavailable databases return ERROR_CODE_UNAVAILABLE, even with HTTP 200.
  rpc Ready(xiaowei.common.Empty) returns (BaseResponse) {
    option (xiaowei.server.common.api).no_login = true;
  }
}

// Common error codes occupy 10000-10099; zero means success.
enum ErrorCode {
  ERROR_CODE_SUCCESS = 0;
  ERROR_CODE_INVALID_REQUEST = 10000;
  ERROR_CODE_INVALID_ARGUMENT = 10001;
  ERROR_CODE_UNAUTHENTICATED = 10002;
  ERROR_CODE_PERMISSION_DENIED = 10003;
  ERROR_CODE_NOT_FOUND = 10004;
  ERROR_CODE_REQUEST_TOO_LARGE = 10005;
  ERROR_CODE_UNSUPPORTED_MEDIA_TYPE = 10006;
  ERROR_CODE_RATE_LIMITED = 10007;
  ERROR_CODE_UNAVAILABLE = 10008;
  ERROR_CODE_INTERNAL_ERROR = 10009;
}

// Result without domain data; also the failure envelope for typed business responses.
message BaseResponse {
  // Numeric value from ErrorCode or the business enum; ranges must not overlap.
  // Zero on success, nonzero on failure; transport success alone does not mean business success.
  int32 code = 1;
  // Safe human-readable description. Clients must not parse this to classify errors.
  string msg = 2;
  // Present and empty on success; omitted on failure. All callers use the same response schema.
  xiaowei.common.Empty data = 3;
}
