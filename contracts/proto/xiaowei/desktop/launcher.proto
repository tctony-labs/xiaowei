syntax = "proto3";

package xiaowei.desktop;

import "google/protobuf/empty.proto";
import "xiaowei/desktop/search.proto";

// Window-bound query batches, result execution and presentation lifecycle.
service Launcher {
  rpc Query(LauncherQueryRequest) returns (LauncherSearchResponse);
  rpc Execute(ResultRequest) returns (ExecuteResponse);
  rpc Hide(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc UpdateLayout(UpdateLayoutRequest) returns (google.protobuf.Empty);
  rpc ResetPosition(google.protobuf.Empty) returns (google.protobuf.Empty);
}

enum LauncherMode {
  LAUNCHER_MODE_UNSPECIFIED = 0;
  LAUNCHER_MODE_SEARCH = 1;
  LAUNCHER_MODE_CLIPBOARD = 2;
  // Quick Chat presentation; conversation state remains in renderer memory.
  LAUNCHER_MODE_QUICK_CHAT = 3;
}

message LauncherOpened {
  reserved 1;
  LauncherMode mode = 2;
}

message LauncherQueryRequest {
  string query = 1;
}

// Display-only result. Actions and application paths remain with the host.
message LauncherHit {
  string id = 1;
  string title = 2;
  string provider = 3;
  string label = 4;
  double score = 5;
  repeated xiaowei.desktop.HighlightRange ranges = 6;
  // Optional image resource URL; clients load it as an image rather than calling an icon RPC.
  optional string icon_url = 7;
}

message LauncherSearchResponse {
  uint32 token = 1;
  reserved 2;
  repeated LauncherHit hits = 3;
}

// Execute only a result from the current query batch; stale token/ID pairs are rejected.
message ResultRequest {
  uint32 token = 1;
  string id = 2;
}

message ExecuteResponse {
  reserved 1;
  optional LauncherMode mode = 2;
}

message UpdateLayoutRequest {
  // Visible result count, not a pixel height. Host owns the layout policy.
  uint32 result_count = 1;
  reserved 2;
  optional LauncherMode mode = 3;
}
