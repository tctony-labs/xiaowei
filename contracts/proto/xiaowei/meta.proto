syntax = "proto3";

package xiaowei.storage;

import "xiaowei/common.proto";

message MetaKey {
  // Full, case-sensitive key, 1–1024 UTF-8 bytes. Prefixes are not authorization boundaries.
  string key = 1;
}

message MetaEntry {
  string key = 1;
  // Valid JSON text, at most 1 MiB. The JSON literal null is a stored value.
  string json = 2;
}

message MetaValue {
  // Missing means no key exists; "null" means the JSON null value exists.
  optional string json = 1;
}

message MetaDeleted {
  bool deleted = 1;
}

message MetaPrefix {
  // Literal, case-sensitive prefix; % and _ are ordinary characters. Empty lists all keys.
  string prefix = 1;
}

message MetaEntries {
  // Full keys in binary sort order. Oversize lists fail instead of truncating settings.
  repeated MetaEntry entries = 1;
}

service Meta {
  rpc Get(MetaKey) returns (MetaValue);

  rpc Set(MetaEntry) returns (xiaowei.common.Empty);

  rpc Delete(MetaKey) returns (MetaDeleted);

  // At most 10000 rows / 4 MiB, including keys and values.
  rpc List(MetaPrefix) returns (MetaEntries);
}
