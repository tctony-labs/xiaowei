syntax = "proto3";

package xiaowei.storage;

import "xiaowei/common.proto";

// SQLite storage classes. Missing kind is invalid; null is explicitly represented.
message SqlValue {
  oneof kind {
    xiaowei.common.Empty null = 1;
    sint64 integer = 2;
    double real = 3;
    string text = 4;
    bytes blob = 5;
  }
}

// References a cell from an earlier transaction step (all indexes are zero-based).
// Missing rows or invalid indexes abort the entire transaction.
message SqlCellReference {
  uint32 step = 1;
  uint32 row = 2;
  uint32 column = 3;
}

message SqlParameter {
  oneof source {
    SqlValue literal = 1;
    SqlCellReference cell = 2;
  }
}

// Exactly one statement; parameters bind by SQLite parameter index, starting at 1.
// Transaction control, attached databases and connection settings are host-owned.
message SqlStatement {
  string sql = 1;
  repeated SqlParameter parameters = 2;
  // If supplied, a different returned row count rolls back the operation.
  optional uint32 expected_rows = 3;
}

message SqlRow {
  repeated SqlValue cells = 1;
}

message SqlResult {
  // Ordered names, including duplicates; cells are addressed by index.
  repeated string columns = 1;
  repeated SqlRow rows = 2;
  uint64 affected_rows = 3;
}

message SqlTransaction {
  // Executed on one connection under BEGIN IMMEDIATE, at most 64 steps.
  // Prior results may be referenced by later parameters; no external callbacks.
  repeated SqlStatement steps = 1;
}

message SqlTransactionResult {
  repeated SqlResult results = 1;
}

message DatabaseMigration {
  // YYYYMMDDHHmmss_description, globally unique and explicitly ordered.
  string name = 1;
  repeated string up = 2;
  repeated string down = 3;
}

message DatabaseMigrations {
  repeated DatabaseMigration migrations = 1;
}

message DatabaseMigrationState {
  string name = 1;
  // Missing means not applied. Stored as Unix seconds in migration_v2.<name>.
  optional int64 applied_at_seconds = 2;
}

message DatabaseMigrationStates {
  repeated DatabaseMigrationState states = 1;
}

message DatabaseRollback {
  // Full ordered registry is required; only its last applied migration may be undone.
  repeated DatabaseMigration migrations = 1;
  string name = 2;
}

service Database {
  // Read-only statement. Limit: 64 KiB SQL, 128 parameters, 10000 rows / 4 MiB result.
  rpc Query(SqlStatement) returns (SqlResult);

  // One statement in a write transaction; may include RETURNING.
  rpc Execute(SqlStatement) returns (SqlResult);

  // Atomic batch. Limits apply to the complete result, not independently per step.
  rpc Transaction(SqlTransaction) returns (SqlTransactionResult);

  // Host startup calls this before starting business producers.
  // Each migration and its completion marker commit atomically; failure stops the batch.
  rpc ApplyMigrations(DatabaseMigrations) returns (DatabaseMigrationStates);

  rpc MigrationStatus(DatabaseMigrations) returns (DatabaseMigrationStates);

  // Explicit maintenance operation; never automatically invoked after startup failure.
  rpc Rollback(DatabaseRollback) returns (DatabaseMigrationStates);
}
