syntax = "proto3";

package testing;

// Test-only contract. Never publish this service as a production capability.
message Envelope {
  reserved 9, 10;
  reserved "removed_value";
  string text = 1;
  uint64 id = 2;
  optional string label = 3;
  message Blob { bytes data = 1; }
  repeated Blob blobs = 4;
  // Explicit absent / null / value; proto3 optional alone has no null state.
  enum Null { NULL_VALUE = 0; }
  oneof value {
    string string_value = 5;
    Null null_value = 6;
  }
}

// Its full Protobuf name is the event identity; export is a runtime decision.
message Changed { Envelope value = 1; }

service Fixture {
  rpc Echo(Envelope) returns (Envelope);
  rpc Watch(Envelope) returns (stream Changed);
}

// A second owner for native bridge tests. Both services reuse the same PB messages.
service PeerFixture {
  rpc Echo(Envelope) returns (Envelope);
  rpc Watch(Envelope) returns (stream Changed);
}
