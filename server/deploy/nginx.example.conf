# Installed in /etc/nginx/sites-enabled/ on the Shanghai server.
# Avoid logging query strings, request bodies and authentication headers.
log_format xiaowei '$remote_addr [$time_local] method=$request_method '
                   'status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name xiaowei.tctony.com;
    access_log /data/xiaowei/logs/nginx-access.log xiaowei;
    return 308 https://xiaowei.tctony.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xiaowei.tctony.com;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /data/xiaowei/logs/nginx-access.log xiaowei;
    error_log /data/xiaowei/logs/nginx-error.log warn;
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;

    location / {
        return 200 "";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:10001;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:10001;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:10001;
    }
}
