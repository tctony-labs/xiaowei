packages:
  - contracts/out/proto-desktop-ts
  - gateway/ts
  - gateway/tests
  - desktop
  - packages/*
  - crates/*/napi

# Protobuf-ES 的运行库与生成器必须同一版本，各包统一写 "catalog:"。
catalog:
  "@bufbuild/protobuf": 2.15.0
  "@bufbuild/protoc-gen-es": 2.15.0

allowBuilds:
  electron: true
  esbuild: true
  # Pi dependencies ship runtime artifacts; no install-time preparation is needed.
  "@google/genai": false
  protobufjs: false
  # Squirrel.Windows is not a configured packaging target.
  electron-winstaller: false
# Keep Vite's optional tsx peer aligned with the desktop toolchain.
overrides:
  tsx: 4.23.13
patchedDependencies:
  '@earendil-works/pi-ai@1.5.2': patches/@earendil-works__pi-ai@1.5.2.patch
  '@earendil-works/pi-schema@1.5.2': patches/@earendil-works__pi-schema@1.5.2.patch
  '@earendil-works/pi-telemetry@1.5.2': patches/@earendil-works__pi-telemetry@1.5.2.patch
