packages:
  - contracts/ts
  - gateway/ts
  - gateway/tests
  - desktop
  - packages/*
  - crates/*/napi
allowBuilds:
  electron: true
  esbuild: true
  # Pi dependencies ship runtime artifacts; no install-time preparation is needed.
  "@google/genai": false
  protobufjs: false
  # Squirrel.Windows is not a configured packaging target.
  electron-winstaller: false
patchedDependencies:
  '@earendil-works/pi-ai@0.85.1': patches/@earendil-works__pi-ai@0.85.1.patch
