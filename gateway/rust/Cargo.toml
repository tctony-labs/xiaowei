[package]
name = "xw-gateway"
version = "0.1.0"
edition = "2024"

[features]
default = []
napi = ["dep:napi", "dep:serde_json"]
test-fixtures = ["napi", "dep:xw-contracts"]

[dependencies]
futures-util = "0.3"
heck = "0.5"
napi = { version = "3", features = ["napi8", "async"], optional = true }
serde_json = { version = "1", optional = true }
xw-contracts = { path = "../../contracts/rust", optional = true }
prost = "=0.14.4"
prost-types = "=0.14.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
xw-contracts = { path = "../../contracts/rust" }
serde_json = "1"
