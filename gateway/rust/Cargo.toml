[package]
name = "xw-gateway"
version = "0.1.0"
edition = "2024"

[features]
default = []
napi = ["dep:napi", "dep:serde_json"]
test-fixtures = ["napi", "dep:proto-testing-rs", "dep:proto-llm-rs"]

[dependencies]
futures-util = "0.3"
heck = "0.5"
napi = { version = "3", features = ["napi8", "async"], optional = true }
serde_json = { version = "1", optional = true }
proto-testing-rs = { path = "../../contracts/out/proto-testing-rs", optional = true }
proto-llm-rs = { path = "../../contracts/out/proto-llm-rs", optional = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
proto-server-rs = { path = "../../contracts/out/proto-server-rs" }
proto-agent-rs = { path = "../../contracts/out/proto-agent-rs" }
proto-llm-rs = { path = "../../contracts/out/proto-llm-rs" }
proto-desktop-rs = { path = "../../contracts/out/proto-desktop-rs" }
proto-testing-rs = { path = "../../contracts/out/proto-testing-rs" }
serde_json = "1"
