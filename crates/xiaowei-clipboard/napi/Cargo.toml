[package]
name = "xiaowei-clipboard-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
gateway-fixtures = ["xw-gateway/test-fixtures"]

[dependencies]
xw-gateway = { path = "../../../gateway/rust", features = ["napi"] }
xiaowei-clipboard = { path = ".." }
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
xw-napi-log = { path = "../../xw-napi-log" }

[build-dependencies]
napi-build = "2"
