[package]
name = "xiaowei-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
xw-gateway = { path = "../../gateway/rust" }
xw-contracts = { path = "../../contracts/rust" }
prost = "=0.14.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
arboard = { version = "3", features = ["image-data"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
xiaowei-storage = { path = "../xiaowei-storage" }
