[package]
name = "xiaowei-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", features = ["image-data"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray"] }

[dev-dependencies]
tempfile = "3"
