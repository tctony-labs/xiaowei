[package]
name = "xw-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
xw-agent-rollout = { path = "../xw-agent-rollout" }
xw-agent-types = { path = "../xw-agent-types" }
xw-agent-runtime = { path = "../xw-agent-runtime" }
xw-contracts = { path = "../../contracts/rust" }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v7"] }
prost = "=0.14.4"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
thiserror = "2"
log = "0.4"

serde_json = "1"

[dev-dependencies]
xw-agent-rollout = { path = "../xw-agent-rollout", features = ["test-support"] }
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
