[package]
name = "xiaowei-platform-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
xiaowei-platform = { path = ".." }
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"
