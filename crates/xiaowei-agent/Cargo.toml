[package]
name = "xiaowei-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
xw-agent = { path = "../xw-agent" }
xw-agent-types = { path = "../xw-agent-types" }
xw-gateway = { path = "../../gateway/rust" }
xw-contracts = { path = "../../contracts/rust" }
