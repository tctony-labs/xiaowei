[package]
name = "xiaowei-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
xw-tokenizer = { path = "../xw-tokenizer" }
xw-gateway = { path = "../../gateway/rust" }
xw-contracts = { path = "../../contracts/rust" }
prost = "=0.14.4"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = "=0.30.1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
