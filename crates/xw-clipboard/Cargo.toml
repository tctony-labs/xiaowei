[package]
name = "xw-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
xw-gateway = { path = "../../gateway/rust" }
proto-desktop-rs = { path = "../../contracts/out/proto-desktop-rs" }
prost = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
xw-platform = { path = "../xw-platform" }
core-foundation = "0.10"
core-graphics = "0.24"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSBitmapImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-image-io = { version = "0.3", default-features = false, features = [
    "CGImageProperties",
    "CGImageSource",
    "std",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
xw-storage = { path = "../xw-storage" }
