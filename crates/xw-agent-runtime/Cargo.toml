[package]
name = "xw-agent-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
xw-agent-types = { path = "../xw-agent-types" }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util"] }
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
similar = "2"
dirs = "6"
regex = "1"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
xw-sandboxed-exec = { path = "../xw-sandboxed-exec" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
