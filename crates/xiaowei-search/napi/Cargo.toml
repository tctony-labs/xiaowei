[package]
name = "xiaowei-search-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
gateway-fixtures = ["xw-gateway/test-fixtures"]

[dependencies]
xw-gateway = { path = "../../../gateway/rust", features = ["napi"] }
log = "0.4"
xw-napi-log = { path = "../../xw-napi-log" }
xiaowei-search = { path = ".." }
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
